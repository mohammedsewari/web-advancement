openapi: 3.0.3
info:
  title: School Locker Reservation API
  version: 1.0.0
  description: >
    Minimal REST API for the HBO-ICT 2.1 Web Advanced Locker Reservation System.
    Supports JWT Bearer authentication, role-based access control (USER, ADMIN),
    atomic multi-locker bookings, and Server-Sent Events (SSE) for live availability updates.

servers:
  - url: /api
    description: Local Express API base path

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the JWT token returned by /auth/login or /auth/register.

  schemas:
    Credentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 128
          example: DemoPass123!

    UserPublic:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        roles:
          type: array
          items:
            type: string
            enum: [USER, ADMIN]
          example: [USER]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Signed HS256 JWT valid for 2 hours
        user:
          $ref: '#/components/schemas/UserPublic'

    LockerInput:
      type: object
      required:
        - code
        - size
        - floor
        - location
        - maxPerUser
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9]+(?:-[A-Z0-9]+)*$'
          maxLength: 30
          example: L-001
        size:
          type: string
          enum: [small, medium, large]
          example: small
        floor:
          type: integer
          minimum: 0
          maximum: 100
          example: 1
        location:
          type: string
          pattern: '^[A-Za-z0-9 -]+$'
          maxLength: 50
          example: A
        maxPerUser:
          type: integer
          minimum: 1
          maximum: 100
          example: 2

    LockerUpdate:
      type: object
      description: Any subset of editable locker fields (merged with existing values before validation).
      properties:
        code:
          type: string
          example: L-001
        size:
          type: string
          enum: [small, medium, large]
          example: large
        floor:
          type: integer
          minimum: 0
          maximum: 100
          example: 2
        location:
          type: string
          example: B
        maxPerUser:
          type: integer
          minimum: 1
          maximum: 100
          example: 3

    Locker:
      allOf:
        - $ref: '#/components/schemas/LockerInput'
        - type: object
          properties:
            id:
              type: integer
              example: 1
            available:
              type: boolean
              description: Included when startAt and durationMinutes query parameters are supplied.
              example: true

    BookingInput:
      type: object
      required:
        - lockerIds
        - startAt
        - durationMinutes
      properties:
        lockerIds:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          maxItems: 100
          uniqueItems: true
          example: [1, 2]
        startAt:
          type: string
          format: date-time
          description: Future UTC ISO-8601 timestamp ending in Z
          example: '2027-05-01T10:00:00.000Z'
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          example: 60

    Reservation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        Lockers:
          type: array
          items:
            $ref: '#/components/schemas/Locker'
        User:
          $ref: '#/components/schemas/UserPublic'

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Descriptive error message explaining what went wrong.

paths:
  /auth/register:
    post:
      summary: Register a new USER account and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Account created and token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid email format or password length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Log in with existing credentials and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid email or password format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Incorrect email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lockers:
    get:
      summary: Public locker list with optional search, attribute filters, and interval availability
      parameters:
        - name: code
          in: query
          description: Exact human-readable locker code (e.g. L-001)
          schema:
            type: string
        - name: size
          in: query
          description: Filter by locker size (small, medium, large)
          schema:
            type: string
            enum: [small, medium, large]
        - name: floor
          in: query
          description: Filter by floor number (0-100)
          schema:
            type: integer
        - name: location
          in: query
          description: Filter by wing/location (e.g. A, B)
          schema:
            type: string
        - name: startAt
          in: query
          description: Future UTC ISO timestamp (requires durationMinutes to compute availability)
          schema:
            type: string
            format: date-time
        - name: durationMinutes
          in: query
          description: Duration in whole minutes (1-1440, requires startAt to compute availability)
          schema:
            type: integer
      responses:
        '200':
          description: Array of matching lockers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Locker'
        '400':
          description: Invalid filter parameter or invalid time interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: 'ADMIN: Create a new locker'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockerInput'
      responses:
        '201':
          description: Locker created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locker'
        '400':
          description: Validation error
        '401':
          description: Missing, invalid, or expired JWT
        '403':
          description: ADMIN role required
        '409':
          description: Locker code already exists

  /lockers/{id}:
    get:
      summary: Read one locker by numeric ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Locker details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locker'
        '400':
          description: ID is not a positive integer
        '404':
          description: Locker not found

    patch:
      summary: 'ADMIN: Update editable locker fields'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockerUpdate'
      responses:
        '200':
          description: Updated locker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locker'
        '400':
          description: Invalid ID or field format
        '401':
          description: Missing, invalid, or expired JWT
        '403':
          description: ADMIN role required
        '404':
          description: Locker not found
        '409':
          description: Duplicate locker code

    delete:
      summary: 'ADMIN: Delete an unreserved locker'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Locker deleted
        '400':
          description: Invalid ID
        '401':
          description: Missing, invalid, or expired JWT
        '403':
          description: ADMIN role required
        '404':
          description: Locker not found
        '409':
          description: Reserved locker cannot be deleted

  /reservations:
    post:
      summary: 'USER: Atomically reserve one or multiple lockers'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
      responses:
        '201':
          description: Reservation created atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Invalid lockerIds, past/invalid startAt, or invalid durationMinutes
        '401':
          description: Missing, invalid, or expired JWT
        '403':
          description: USER role required (admin-only accounts cannot reserve)
        '404':
          description: One or more selected lockers do not exist
        '409':
          description: Overlapping booking conflict or simultaneous per-kind limit exceeded

    get:
      summary: 'ADMIN: List or filter reservations by reservation ID, locker ID, or locker code'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          description: Filter by reservation ID
          schema:
            type: integer
            minimum: 1
        - name: lockerId
          in: query
          description: Filter reservations that include this numeric locker ID
          schema:
            type: integer
            minimum: 1
        - name: code
          in: query
          description: Filter reservations that include this human-readable locker code (e.g. L-001)
          schema:
            type: string
      responses:
        '200':
          description: Matching reservations including associated Lockers and User email
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '400':
          description: Invalid filter parameter
        '401':
          description: Missing, invalid, or expired JWT
        '403':
          description: ADMIN role required

  /reservations/my:
    get:
      summary: 'USER: List own reservations (scoped to authenticated JWT subject)'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reservations belonging to the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          description: Missing, invalid, or expired JWT
        '403':
          description: USER role required

  /reservations/{id}:
    get:
      summary: 'ADMIN: Get a single reservation by ID'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Reservation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Invalid ID
        '401':
          description: Missing, invalid, or expired JWT
        '403':
          description: ADMIN role required
        '404':
          description: Reservation not found

  /users:
    get:
      summary: 'ADMIN: Search for a user by exact normalized email'
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Matching user accounts (id, email, roles; never passwordHash)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPublic'
        '400':
          description: Missing or invalid email query parameter
        '401':
          description: Missing, invalid, or expired JWT
        '403':
          description: ADMIN role required

  /events:
    get:
      summary: Public Server-Sent Events (SSE) stream for live locker availability updates
      description: >
        Keeps an open HTTP text/event-stream connection. Emits an initial `ready` event
        and broadcasts an `availability` event with empty payload `{}` whenever a reservation
        is created or a locker is created, updated, or deleted. Designed for a single-server deployment.
      responses:
        '200':
          description: Open SSE stream (`text/event-stream`)
          content:
            text/event-stream:
              schema:
                type: string
                example: "retry: 3000\nevent: ready\ndata: {}\n\n"
