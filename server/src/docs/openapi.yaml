openapi: 3.0.3

info:
  title: Train Locker Reservation API
  version: 1.0.0
  description: |
    API for the Train Locker Reservation system.
    Users can register, login, browse lockers and make reservations.
    Admins can manage lockers and user accounts.
    Full documentation available at /api-docs.

servers:
  - url: http://localhost:3000
    description: Local development server

# Tags group related endpoints together in the Swagger UI
tags:
  - name: Users
    description: Register, login and manage your own account
  - name: Lockers
    description: Browse and manage lockers (admin can create/update/delete)
  - name: Reservations
    description: Make, view and cancel reservations

paths:

  # ───────────────────────────────────────────
  # USERS
  # ───────────────────────────────────────────

  /users/register:
    post:
      tags: [Users]
      summary: Register a new user account
      # We SEND email + password. Server saves password as a BCrypt hash, never plain text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          # 201 = "Created" — something new was made in the database
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input (e.g. missing email or weak password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          # 409 = "Conflict" — email already exists
          description: Email address is already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/login:
    post:
      tags: [Users]
      summary: Login and receive a JWT token
      # We SEND email + password. Server checks BCrypt hash and returns a JWT wristband.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          # 200 = "OK" — nothing was created, we just got back a token
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          # 401 = "Unauthorized" — server doesn't know who you are
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users:
    get:
      tags: [Users]
      summary: Get all users (admin only)
      # Middleware checks JWT and role=admin before this runs
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          description: Filter users by email (FR-09 — search a specific user)
          schema:
            type: string
          example: john@example.com
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: No token provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          # 403 = "Forbidden" — server knows you, but you're not an admin
          description: You are not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a single user by id (admin or own account)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: The requested user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Users]
      summary: Update your own account details (US-04 — manage personal data)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: You can only update your own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Users]
      summary: Deactivate a user account (admin only — US-10)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          # 204 = "No Content" — success but nothing to send back
          description: User account deactivated
        '403':
          description: You are not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ───────────────────────────────────────────
  # LOCKERS
  # ───────────────────────────────────────────

  /lockers:
    get:
      tags: [Lockers]
      summary: Get all lockers with optional filtering (US-02, FR-01, FR-06)
      # No auth needed — anyone can browse lockers
      parameters:
        - name: station
          in: query
          description: Filter by station name (NFR-04 — at least 3 filterable attributes)
          schema:
            type: string
          example: Amsterdam Centraal
        - name: size
          in: query
          description: Filter by locker size (small / medium / large)
          schema:
            type: string
            enum: [small, medium, large]
        - name: available
          in: query
          description: Filter to only show available lockers
          schema:
            type: boolean
          example: true
        - name: sortBy
          in: query
          description: Sort results (NFR-13)
          schema:
            type: string
            enum: [station, size, price]
        - name: limit
          in: query
          description: Limit number of results (NFR-14)
          schema:
            type: integer
            minimum: 1
          example: 10
      responses:
        '200':
          description: List of lockers matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Locker'

    post:
      tags: [Lockers]
      summary: Create a new locker (admin only — FR-14, US-07)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockerInput'
      responses:
        '201':
          description: Locker created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locker'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: You are not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /lockers/{id}:
    get:
      tags: [Lockers]
      summary: Get a single locker by id (FR-10 — search specific item)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested locker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locker'
        '404':
          description: Locker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Lockers]
      summary: Update a locker (admin only — FR-14)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockerInput'
      responses:
        '200':
          description: Locker updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locker'
        '403':
          description: You are not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Locker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Lockers]
      summary: Delete a locker (admin only — FR-14)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Locker deleted
        '403':
          description: You are not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Locker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ───────────────────────────────────────────
  # RESERVATIONS
  # ───────────────────────────────────────────

  /reservations:
    get:
      tags: [Reservations]
      summary: Get reservations — own ones for users, all for admins (US-03, US-08)
      security:
        - bearerAuth: []
      parameters:
        - name: lockerId
          in: query
          description: Filter by locker (admin — FR-11, US-08)
          schema:
            type: integer
        - name: userId
          in: query
          description: Filter by user (admin only)
          schema:
            type: integer
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Reservations]
      summary: Create one or more reservations (US-05, US-12, FR-07, FR-12)
      security:
        - bearerAuth: []
      # US-05 says reserve multiple at once — so we accept an array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lockerIds:
                  type: array
                  items:
                    type: integer
                  example: [1, 2]
                startTime:
                  type: string
                  format: date-time
                  example: "2026-11-20T09:00:00Z"
                duration:
                  type: integer
                  description: Duration in hours (NFR-02)
                  example: 4
      responses:
        '201':
          description: Reservation(s) created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '400':
          description: Invalid input or locker not available at that time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reservations/{id}:
    get:
      tags: [Reservations]
      summary: Get a single reservation by id (FR-11)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The requested reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Reservations]
      summary: Cancel a reservation (US-06 — only allowed 24h in advance, FR-08)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Reservation cancelled
        '400':
          description: Cannot cancel within 24 hours of start time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: You can only cancel your own reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reservation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# ───────────────────────────────────────────
# REUSABLE SCHEMAS (used with $ref above)
# ───────────────────────────────────────────

components:
  # This tells Swagger that protected endpoints need a Bearer token in the header
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # What we SEND when registering or logging in
    UserInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          minLength: 8
          example: secret123

    # What we GET BACK when reading a user (password never comes back!)
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        email:
          type: string
          example: john@example.com
        role:
          type: string
          enum: [user, admin]
          example: user
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # What we SEND when creating or updating a locker
    LockerInput:
      type: object
      required: [number, station, size, pricePerHour]
      properties:
        number:
          type: string
          description: Human readable unique identifier (NFR-01)
          example: A-042
        station:
          type: string
          example: Amsterdam Centraal
        size:
          type: string
          enum: [small, medium, large]
          example: medium
        pricePerHour:
          type: number
          example: 1.50
        maxReservationsAtOnce:
          type: integer
          description: Max times this locker can be reserved simultaneously (US-09)
          example: 1

    # What we GET BACK when reading a locker
    Locker:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        number:
          type: string
          example: A-042
        station:
          type: string
          example: Amsterdam Centraal
        size:
          type: string
          enum: [small, medium, large]
          example: medium
        pricePerHour:
          type: number
          example: 1.50
        maxReservationsAtOnce:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # What we GET BACK when reading a reservation
    Reservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        userId:
          type: integer
          example: 3
        lockerId:
          type: integer
          example: 1
        startTime:
          type: string
          format: date-time
          example: "2026-11-20T09:00:00Z"
        duration:
          type: integer
          description: Duration in hours
          example: 4
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # The shape every error response uses
    Error:
      type: object
      properties:
        message:
          type: string
          example: Locker with id 99 not found
      required: [message]
